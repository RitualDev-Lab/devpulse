name: Test & Publish Multi-Language SDKs

on:
  push:
    tags:
      - "sdk-v*"
  workflow_dispatch:
    inputs:
      publish:
        description: "Publish to public registries when secrets are configured"
        type: boolean
        default: false

permissions:
  contents: read

jobs:
  js-sdk:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: packages/devpulse-js
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: 20
          registry-url: https://registry.npmjs.org
      - run: npm ci --ignore-scripts --no-audit --no-fund
      - run: npm test
      - name: Publish to npm
        if: (startsWith(github.ref, 'refs/tags/sdk-v') || inputs.publish) && env.NODE_AUTH_TOKEN != ''
        env:
          NODE_AUTH_TOKEN: ${{ secrets.NPM_TOKEN }}
        run: npm publish --access public

  python-sdk:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: packages/devpulse-py
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: "3.12"
      - run: python -m unittest discover -s tests
      - name: Build wheel & sdist
        run: |
          python -m pip install --upgrade build twine
          python -m build
      - name: Publish to PyPI
        if: (startsWith(github.ref, 'refs/tags/sdk-v') || inputs.publish) && env.TWINE_PASSWORD != ''
        env:
          TWINE_USERNAME: __token__
          TWINE_PASSWORD: ${{ secrets.PYPI_API_TOKEN }}
        run: twine upload dist/*

  rust-sdk:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: packages/devpulse-rs
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: dtolnay/rust-toolchain@39008827e6b4319a349e9a42dfc90579dd25f1ca # stable
      - run: cargo test
      - name: Publish to crates.io
        if: (startsWith(github.ref, 'refs/tags/sdk-v') || inputs.publish) && env.CARGO_REGISTRY_TOKEN != ''
        env:
          CARGO_REGISTRY_TOKEN: ${{ secrets.CARGO_REGISTRY_TOKEN }}
        run: cargo publish

  go-dotnet-jvm-php-ruby:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-go@40f1582b2485089dde7abd97c1529aa768e1baff # v5
        with:
          go-version: "1.22"
      - name: Test devpulse-go
        working-directory: packages/devpulse-go
        run: go test ./...
      - uses: actions/setup-dotnet@67a3573c9a986a3f9c594539f4ab511d57bb3ce9 # v4
        with:
          dotnet-version: "8.0.x"
      - name: Pack DevPulse.Sdk (.NET)
        working-directory: packages/DevPulse.Sdk
        run: dotnet pack -c Release
      - uses: actions/setup-java@cf277c60eb25467037889841efdb72551f06f6c3 # v4
        with:
          distribution: temurin
          java-version: "17"
      - name: Compile devpulse-jvm
        working-directory: packages/devpulse-jvm
        run: mvn -B compile
      - uses: ruby/setup-ruby@145243922b4465b78e04dd66294782c7de45901f # v1
        with:
          ruby-version: "3.3"
      - name: Verify devpulse-rb gemspec
        working-directory: packages/devpulse-rb
        run: |
          ruby -c lib/devpulse.rb
          gem build devpulse-rb.gemspec
