name: Test & Publish Multi-Language SDKs

on:
  push:
    tags:
      - "sdk-v*"
  workflow_dispatch:
    inputs:
      publish:
        description: "Publish to public registries when secrets are configured"
        type: boolean
        default: false

permissions:
  contents: read

jobs:
  js-sdk:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: packages/devpulse-js
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          registry-url: https://registry.npmjs.org
      - run: npm ci --ignore-scripts --no-audit --no-fund
      - run: npm test
      - name: Publish to npm
        if: (startsWith(github.ref, 'refs/tags/sdk-v') || inputs.publish) && env.NODE_AUTH_TOKEN != ''
        env:
          NODE_AUTH_TOKEN: ${{ secrets.NPM_TOKEN }}
        run: npm publish --access public

  python-sdk:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: packages/devpulse-py
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: python -m unittest discover -s tests
      - name: Build wheel & sdist
        run: |
          python -m pip install --upgrade build twine
          python -m build
      - name: Publish to PyPI
        if: (startsWith(github.ref, 'refs/tags/sdk-v') || inputs.publish) && env.TWINE_PASSWORD != ''
        env:
          TWINE_USERNAME: __token__
          TWINE_PASSWORD: ${{ secrets.PYPI_API_TOKEN }}
        run: twine upload dist/*

  rust-sdk:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: packages/devpulse-rs
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - run: cargo test
      - name: Publish to crates.io
        if: (startsWith(github.ref, 'refs/tags/sdk-v') || inputs.publish) && env.CARGO_REGISTRY_TOKEN != ''
        env:
          CARGO_REGISTRY_TOKEN: ${{ secrets.CARGO_REGISTRY_TOKEN }}
        run: cargo publish

  go-dotnet-jvm-php-ruby:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version: "1.22"
      - name: Test devpulse-go
        working-directory: packages/devpulse-go
        run: go test ./...
      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: "8.0.x"
      - name: Pack DevPulse.Sdk (.NET)
        working-directory: packages/DevPulse.Sdk
        run: dotnet pack -c Release
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"
      - name: Compile devpulse-jvm
        working-directory: packages/devpulse-jvm
        run: mvn -B compile
      - uses: ruby/setup-ruby@v1
        with:
          ruby-version: "3.3"
      - name: Verify devpulse-rb gemspec
        working-directory: packages/devpulse-rb
        run: |
          ruby -c lib/devpulse.rb
          gem build devpulse-rb.gemspec
