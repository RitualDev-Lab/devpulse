name: Scheduled Metrics Sync Pipeline

on:
  schedule:
    # Run every 6 hours (00:00, 06:00, 12:00, 18:00 UTC)
    - cron: '0 */6 * * *'
  workflow_dispatch: # Allows manual trigger from GitHub Actions tab

jobs:
  sync:
    name: Ingest Universal Ecosystem Metrics
    runs-on: ubuntu-latest
    steps:
      - name: Trigger DevPulse Sync Endpoint
        run: |
          echo "Triggering DevPulse scheduled metrics ingestion..."
          RESPONSE=$(curl -s -w "\nHTTP_STATUS:%{http_code}" -X POST "https://devpulse.ritualdev.in/api/cron/sync")
          echo "$RESPONSE"
          STATUS=$(echo "$RESPONSE" | grep "HTTP_STATUS" | cut -d':' -f2)
          if [ "$STATUS" -ge 200 ] && [ "$STATUS" -lt 300 ]; then
            echo "Successfully synced all multi-registry metrics!"
          else
            echo "Sync completed with status $STATUS"
          fi
