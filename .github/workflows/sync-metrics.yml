name: Scheduled Metrics Sync (DevPulse)

on:
  schedule:
    # Runs twice daily at 00:00 and 12:00 UTC
    - cron: '0 */12 * * *'
  workflow_dispatch: # Allows manual trigger from GitHub Actions tab

jobs:
  sync-metrics:
    name: Sync Package & Repo Metrics
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: 'npm'

      - name: Install Dependencies
        run: npm ci

      - name: Run DevPulse Metrics Sync
        env:
          TURSO_DATABASE_URL: ${{ secrets.TURSO_DATABASE_URL || 'libsql://devpulse-ritual-dev-git.aws-us-east-2.turso.io' }}
          TURSO_AUTH_TOKEN: ${{ secrets.TURSO_AUTH_TOKEN }}
        run: npx tsx scripts/sync.ts
