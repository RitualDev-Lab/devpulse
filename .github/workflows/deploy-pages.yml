name: Deploy (Cloudflare Pages)

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: pages-deploy
  cancel-in-progress: false

jobs:
  deploy:
    runs-on: ubuntu-latest
    env:
      NEXT_PUBLIC_APP_URL: ${{ vars.NEXT_PUBLIC_APP_URL }}
      NEXT_PUBLIC_PORTAL_DOMAIN: ${{ vars.NEXT_PUBLIC_PORTAL_DOMAIN }}
      NEXT_PUBLIC_CNAME_TARGET: ${{ vars.NEXT_PUBLIC_CNAME_TARGET }}
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: 20
          cache: npm
      - run: npm ci --ignore-scripts --no-audit --no-fund
      - name: Require public app URL
        run: |
          if [ -z "$NEXT_PUBLIC_APP_URL" ]; then
            echo "Repository variable NEXT_PUBLIC_APP_URL is not set" >&2
            exit 1
          fi
      - name: Build for Cloudflare
        run: npm run build:cf
      - name: Deploy to Pages
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          PAGES_PROJECT: ${{ vars.CLOUDFLARE_PAGES_PROJECT }}
        run: npx wrangler pages deploy .open-next/assets --project-name "${PAGES_PROJECT:-devpulse}" --branch main
