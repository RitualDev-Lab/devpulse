{{- if .Values.networkPolicy.enabled }}
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: {{ include "devpulse.fullname" . }}-zero-egress
  labels:
    {{- include "devpulse.labels" . | nindent 4 }}
spec:
  podSelector:
    matchLabels:
      {{- include "devpulse.selectorLabels" . | nindent 6 }}
  policyTypes:
    - Ingress
    - Egress
  ingress:
    - from:
        - namespaceSelector: {}
      ports:
        - protocol: TCP
          port: 3000
  egress:
    # Allow internal Kubernetes DNS lookups only
    - to:
        - namespaceSelector:
            matchLabels:
              kubernetes.io/metadata.name: kube-system
      ports:
        - protocol: UDP
          port: 53
        - protocol: TCP
          port: 53
    # Allow internal VPC databases, ClickHouse, OpenFGA, and internal IdP ONLY
    - to:
        {{- range .Values.networkPolicy.allowedEgressCidrs }}
        - ipBlock:
            cidr: {{ . }}
        {{- end }}
      ports:
        - protocol: TCP
          port: 5432
        - protocol: TCP
          port: 8123
        - protocol: TCP
          port: 8080
        - protocol: TCP
          port: 443
{{- end }}
