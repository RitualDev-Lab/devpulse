name = "devpulse"
pages_build_output_dir = ".open-next/assets"
compatibility_date = "2024-09-23"
compatibility_flags = ["nodejs_compat"]

# Secrets and per-environment values are NOT committed. Set them with
# `wrangler secret put <NAME>` or in the Cloudflare dashboard:
#   TURSO_DATABASE_URL, TURSO_AUTH_TOKEN, NEXT_PUBLIC_SUPABASE_URL, NEXT_PUBLIC_SUPABASE_ANON_KEY,
#   NEXT_PUBLIC_APP_URL, CLOUDFLARE_ZONE_ID, GITHUB_CLIENT_ID, GITHUB_CLIENT_SECRET, CRON_SECRET, ...
[vars]
R2_BUCKET_NAME = "devpulse-storage"
